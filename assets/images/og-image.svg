<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogBg)" />
  
  <circle cx="950" cy="200" r="280" fill="#0d9488" opacity="0.15" filter="blur(60px)" />
  <circle cx="200" cy="500" r="200" fill="#2563eb" opacity="0.12" filter="blur(50px)" />

  <!-- Brand badge -->
  <g transform="translate(100, 100)">
    <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#0d9488" stroke-width="1.5" />
    <circle cx="22" cy="21" r="7" fill="#2dd4bf" />
    <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">BINOD STHAPIT</text>
  </g>

  <!-- Headline -->
  <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Scale Your Business with</text>
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#2dd4bf">AI-Driven Digital Marketing Solutions</text>

  <!-- Subtitle -->
  <text x="100" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">I help small and medium business owners attract the right customers,</text>
  <text x="100" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">generate more leads, and increase sales through practical AI tools.</text>

  <!-- CTA pill -->
  <g transform="translate(100, 470)">
    <rect width="320" height="58" rx="29" fill="#0d9488" />
    <text x="160" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Book a Free Consultation Call</text>
  </g>

  <!-- Location tag -->
  <g transform="translate(450, 470)">
    <rect width="210" height="58" rx="29" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="105" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">Kathmandu, Nepal</text>
  </g>
</svg>
