<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="560" rx="28" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern Lines -->
  <path d="M 0,80 L 500,80 M 0,160 L 500,160 M 0,240 L 500,240 M 0,320 L 500,320 M 0,400 L 500,400 M 0,480 L 500,480" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M 80,0 L 80,560 M 160,0 L 160,560 M 240,0 L 240,560 M 320,0 L 320,560 M 400,0 L 400,560" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Outer Glow Circle -->
  <circle cx="250" cy="220" r="140" fill="url(#glowGrad)" opacity="0.35" filter="blur(20px)" />
  
  <!-- Inner Ring -->
  <circle cx="250" cy="220" r="130" fill="#1e293b" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Stylized Portrait Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 140,390 C 140,320 185,290 250,290 C 315,290 360,320 360,390 L 360,420 C 360,420 315,440 250,440 C 185,440 140,420 140,420 Z" fill="url(#avatarGrad)" opacity="0.9" />
  <!-- Suit Collar / Lapels -->
  <path d="M 215,310 L 250,380 L 285,310" stroke="#0f172a" stroke-width="3" fill="none" stroke-linejoin="round" />
  <path d="M 250,380 L 250,440" stroke="#0f172a" stroke-width="2" />
  <!-- Tie -->
  <polygon points="244,380 256,380 254,420 250,428 246,420" fill="#0d9488" />

  <!-- Head & Neck -->
  <!-- Neck -->
  <rect x="232" y="235" width="36" height="50" rx="8" fill="#e2e8f0" />
  <!-- Head Oval -->
  <ellipse cx="250" cy="180" rx="55" ry="65" fill="#f8fafc" />
  <!-- Stylized Hair -->
  <path d="M 195,175 C 195,120 230,110 255,110 C 290,110 305,130 305,175 C 295,145 270,140 250,140 C 225,140 205,150 195,175 Z" fill="#0f172a" />
  <!-- Minimalist Glasses -->
  <rect x="212" y="166" width="32" height="18" rx="4" fill="none" stroke="#0d9488" stroke-width="2.5" />
  <rect x="256" y="166" width="32" height="18" rx="4" fill="none" stroke="#0d9488" stroke-width="2.5" />
  <line x1="244" y1="174" x2="256" y2="174" stroke="#0d9488" stroke-width="2.5" />

  <!-- Decorative AI Network Node Badges -->
  <g transform="translate(370, 110)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#0d9488" stroke-width="2" />
    <path d="M -10,0 L 0,-10 L 10,0 L 0,10 Z" fill="#2dd4bf" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  <g transform="translate(100, 260)">
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#60a5fa" text-anchor="middle">AI</text>
  </g>

  <!-- Name & Credentials Overlay Plate -->
  <g transform="translate(40, 430)">
    <rect width="420" height="90" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <!-- Monogram Circle -->
    <circle cx="50" cy="45" r="26" fill="#0d9488" />
    <text x="50" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">BS</text>
    
    <!-- Text Labels -->
    <text x="92" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Binod Sthapit</text>
    <text x="92" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#2dd4bf">AI Marketing Expert • Kathmandu, Nepal</text>
  </g>
</svg>
